[project]
name = "incremental"
version = "0.1.0"
description = "A causal targeting engine: uplift modeling on RCT data, turned into budget-constrained campaign decisions"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
model = ["xgboost>=2.0", "scikit-learn>=1.4", "causalml", "matplotlib"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
